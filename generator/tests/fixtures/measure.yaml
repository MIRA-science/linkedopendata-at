id: https://example.org/measure
name: measure
prefixes:
  linkml: https://w3id.org/linkml/
  ex: https://example.org/measure#
  sioc: http://rdfs.org/sioc/ns#
default_prefix: ex
imports: [linkml:types]
default_range: string
classes:
  Measurement:
    slots: [title, value, ratio, count, notes]
  Item:
    class_uri: sioc:Item
slots:
  title: {}
  value: {range: decimal}
  ratio: {range: float, multivalued: true}
  count: {range: integer}
  notes: {range: Item}
