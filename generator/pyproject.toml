[project]
name = "lod-at-gen"
version = "0.0.1"
description = "Proof of concept: generate ATProto lexicons and JSON-LD contexts from a LinkML schema"
requires-python = ">=3.12"
dependencies = ["linkml-runtime>=1.9", "pyyaml"]

[project.scripts]
lod-at-gen = "lod_at_gen.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lod_at_gen"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "rdflib>=7.6.0",
]
